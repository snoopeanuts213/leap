
<!doctype HTML>
<html>
	<head>
		<title>
			LEAP 1571 ~ 1700
		</title>
		<style>
			.main {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				width: 100%;
			}
			#Q_Text {
				font-size: 70px;
				text-align: center;
				user-select: none;
				margin-top: 0px;
			}
			#A_Text {
				font-size: 20px;
				text-align: center;
				user-select: none;
			}
			#A_Input {
				height: 30ox;
				font-size: 30px;
				position: relative;
				left: 50%;
				transform: translateX(-50%);
			}
			#progress {
				position: absolute;
				top: 10%;
				left: 20%;
			}
			#result {
				visibility: hidden;
				background-color: #EEE;
				height: 300px;
				width: 700px; 
				opacity: 0.95;
				border-radius: 30px;
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				user-select: none;
			}
			#result p {
				text-align: center;
				font-size: 50px;
			}
			#result input {
				position: relative;
				left: 50%;
				transform: translateX(-50%);
			}
		</style>
	</head>
	<body>
		<div class="main">
			<p id="Q_Text"></p>
			<p id="A_Text">none
			</p>
			<form onsubmit="return send();">
				<input autocomplete="off" id="A_Input">
			</form>
		</div>
		<div id="result">
			<p id="R_Text">正答率 : </p>
			<form onsubmit="return restart();">
				<input  type="submit" value="もう一度" >
			</form>
		</div>
		<p id="progress"></p>
		<script>
			var QText = document.getElementById("Q_Text");
			var AText = document.getElementById("A_Text");
			var AInput = document.getElementById("A_Input");
			var result = document.getElementById("result");
			var RText = document.getElementById("R_Text");
			var progress = document.getElementById("progress");
			var Question	= {
				all : [""],
				now : [""]
			}
			var fail = 0;
			var color = ["#FFF","#FFA","#EA0","#B00"];
			var sent = 0;
			var finished = 0;
			var len = 0;
			function send() {
				event.preventDefault()
				sent++;
				if (AInput.value == Question.now[1]) {
					finished++;
					progress.innerHTML = `${finished} / ${len}`;
					AInput.value = "";
					AInput.style.backgroundColor = "#FFF";
					AInput.style.color = "#000";
					if (Question.all[0].length == 0) {
						fin()
					} else {
						next()
					}
				} else {
					fail++;
					AInput.value = "";
					AText.style.visibility = "visible";
					var ans = "";
					if (fail == 1) {
						for (var i = 0; i < Question.now[1].length - 1; i++) ans += "*";
						ans += Question.now[1].at(ans.length)
					} else {
						if (fail == 2) {
							ans += Question.now[1].at(0) + Question.now[1].at(1)
							for (var i = 0; i < Question.now[1].length - 3; i++) ans += "*";
							if (Question.now[1].length > 2) ans += Question.now[1].at(ans.length)
						} else {
							ans = Question.now[1]
						}
					}
					AText.innerHTML = ans;
					if (fail < 3) {
						AInput.style.backgroundColor = color[fail];
					} else {
						AInput.style.backgroundColor = color[3];
						AInput.style.color = "#FFF";
					}
				}
			}

			function next() {
					fail = 0;
					AInput.style.backgroundColor = "#FFF";
					AInput.style.color = "#000";
					var random = Math.floor(Math.random()*Question.all[0].length);

					for (var n = 0; n < 2; n++) {
						Question.now[n] = Question.all[n][random];
					}

					Question.all[0].splice(random,1)
					Question.all[1].splice(random,1)
					QText.innerHTML = Question.now[0];
					AText.innerHTML = "none";
					AText.style.visibility = "hidden";
			}

			function restart() {
				event.preventDefault();
				result.style.visibility = "hidden";
				start(); 
			}
			
			function start() {
				finished = 0;
				sent = 0;
				Question.all = [
					["残骸 (w)","犠牲 (t)","かき乱す (d)","邪魔する (i)","立ちふさがる (c)","爆発する (e)","衝突する (c)","甥 (n)","幼児 (i)","配偶者 (s)","相続人 (h)","人々 (f)","同等の人 (p)","受け取る人 (r)","進路を決める (n)","逃亡する (f)","退く (r)","這って進む (c)","空中にとどまる (h)","漂う (d)","〜を変える (a)","AをBに転換する (c)","〜を追い越す (o)","〜を派遣する (d)","縮む (s)","しおれる (w)","降下する (d)","〜を加速する (a)","変動する (f)","〜を歪める (d)","割れる (c)","移り変わり (t)","革命的なこと (g)","〜を補強する (r)","〜を育成する (f)","崩壊 (b)","崩壊する (c)","OをCにする (r)","〜を低下させる (i)","〜を弱める (u)","対処する (c)","〜に取り組む (t)","〜を取り壊す (d)","〜を閉じ込める (c)","〜を指定する (d)","〜を規制する (r)","控える (r)","〜を禁じる (p)","〜を止める (h)","制約 (c)","〜を刺激する (s)","〜を活気づける (a)","〜を駆り立てる (s)","〜をせき立てる (u)","Aに〜することを強制する (c)","〜をぼやかす (b)","〜の方向を変える (d)","〜を逆転する (r)","〜の影を薄くさせる (o)","〜を悪化させる (w)","〜を危険にさらす (j)","〜を補う (s)","〜をもたらす (p)","〜を引き起こす (i)","〜を裏切る (b)","〜をいじめる (b)","〜を無視する (d)","〜を絞る (s)","〜をこする (r)","〜を粉砕する (s)","〜を差し込む (i)","AをBから切り離す (d)","〜を引っ込める (w)","〜をまとめる (c)","拾い読みする (b)","〜を操作する (m)","〜を実行する (i)","〜を遂行する (e)","〜を主催する (h)","〜を据え付ける (m)","〜を排出する (d)","〜の水を抜く (d)","〜を浸す (s)","〜をちょっとつける (d)","〜を吊るす (s)","〜を取り出す (e)","〜を平手打ちする (s)","〜を抱擁する (e)","着手する (e)","介入する (i)","〜に入り込む (p)","立ち入る (i)","〜を利用する (u)","〜を埋め込む (e)","〜を割り当てる (a)","〜をうまく調整する (c)","まばたきする (b)","ぐるぐる回る (s)","回転する (r)","急いで動く (s)","消える (v)","ポキンと折れる (s)","ガタガタ鳴る (r)","〜しなくなる (c)","急ぐこと (h)","〜を隠す (c)","〜を隠す (d)","〜をだます (d)","〜を怠る (n)","〜を避難させる (e)","同時に起きる (c)","普及している (p)","〜を維持する (s)","残る (l)","生き返る (r)","〜を再開する (r)","発生 (o)","〜を検査する (i)","探検 (e)","入学する (e)","〜を躾ける (d)","授業料 (t)","倫理 (e)","心理学 (p)","天文学 (a)","考古学者 (a)","論文 (t)","寮 (d)","〜を理解する (g)","〜を予想する (a)"],
					["wreck","toll","disrupt","interfere","confront","explode","collide","nephew","infant","spouse","heir","folk","peer","recipient","navigate","flee","retreat","crawl","hover","drift","alter","convert","overtake","dispatch","shrink","wither","descend","accelerate","fluctuate","distort","crack","transition","game-changer","reinforce","foster","breakdown","collapse","render","impair","undermine","cope","tackle","demolish","confine","designate","regulate","refrain","prohibit","halt","constraint","stimulate","animate","spur","urge","compel","blur","divert","reverse","overshadow","worsen","jeopardize","supplement","pose","induce","betray","bully","disregard","squeeze","rub","smash","insert","detach","withdraw","compile","browse","manipulate","implement","execute","host","mount","discharge","drain","soak","dip","suspend","extract","slap","embrace","embark","intervene","penetrate","intrude","utilize","embed","allocate","coordinate","blink","spin","rotate","scramble","vanish","snap","rattle","cease","haste","conceal","disguise","deceive","neglect","evacuate","coincide","prevail","sustain","linger","revive","resume","outbreak","inspect","expedition","enroll","discipline","tuition","ethic","psychology","astronomy","archaeologist","thesis","dormitory","grasp","anticipate"]
				];
				len = Question.all[0].length;
				progress.innerHTML = `${finished} / ${len}`;
				next()
			}

			function fin() {
				RText.innerHTML = `正答率 : ${Math.floor(len/sent*1000)/10}%`
				result.style.visibility = "visible";
			}

			start()
		</script>
	</body>
</html>
