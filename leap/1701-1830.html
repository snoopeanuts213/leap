
<!doctype HTML>
<html>
	<head>
		<title>
			LEAP 1701 ~ 1830
		</title>
		<style>
			.main {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				width: 100%;
			}
			#Q_Text {
				font-size: 70px;
				text-align: center;
				user-select: none;
				margin-top: 0px;
			}
			#A_Text {
				font-size: 20px;
				text-align: center;
				user-select: none;
			}
			#A_Input {
				height: 30ox;
				font-size: 30px;
				position: relative;
				left: 50%;
				transform: translateX(-50%);
			}
			#progress {
				position: absolute;
				top: 10%;
				left: 20%;
			}
			#result {
				visibility: hidden;
				background-color: #EEE;
				height: 300px;
				width: 700px; 
				opacity: 0.95;
				border-radius: 30px;
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				user-select: none;
			}
			#result p {
				text-align: center;
				font-size: 50px;
			}
			#result input {
				position: relative;
				left: 50%;
				transform: translateX(-50%);
			}
		</style>
	</head>
	<body>
		<div class="main">
			<p id="Q_Text"></p>
			<p id="A_Text">none
			</p>
			<form onsubmit="return send();">
				<input autocomplete="off" id="A_Input">
			</form>
		</div>
		<div id="result">
			<p id="R_Text">正答率 : </p>
			<form onsubmit="return restart();">
				<input  type="submit" value="もう一度" >
			</form>
		</div>
		<p id="progress"></p>
		<script>
			var QText = document.getElementById("Q_Text");
			var AText = document.getElementById("A_Text");
			var AInput = document.getElementById("A_Input");
			var result = document.getElementById("result");
			var RText = document.getElementById("R_Text");
			var progress = document.getElementById("progress");
			var Question	= {
				all : [""],
				now : [""]
			}
			var fail = 0;
			var color = ["#FFF","#FFA","#EA0","#B00"];
			var sent = 0;
			var finished = 0;
			var len = 0;
			function send() {
				event.preventDefault()
				sent++;
				if (AInput.value == Question.now[1]) {
					finished++;
					progress.innerHTML = `${finished} / ${len}`;
					AInput.value = "";
					AInput.style.backgroundColor = "#FFF";
					AInput.style.color = "#000";
					if (Question.all[0].length == 0) {
						fin()
					} else {
						next()
					}
				} else {
					fail++;
					AInput.value = "";
					AText.style.visibility = "visible";
					var ans = "";
					if (fail == 1) {
						for (var i = 0; i < Question.now[1].length - 1; i++) ans += "*";
						ans += Question.now[1].at(ans.length)
					} else {
						if (fail == 2) {
							ans += Question.now[1].at(0) + Question.now[1].at(1)
							for (var i = 0; i < Question.now[1].length - 3; i++) ans += "*";
							if (Question.now[1].length > 2) ans += Question.now[1].at(ans.length)
						} else {
							ans = Question.now[1]
						}
					}
					AText.innerHTML = ans;
					if (fail < 3) {
						AInput.style.backgroundColor = color[fail];
					} else {
						AInput.style.backgroundColor = color[3];
						AInput.style.color = "#FFF";
					}
				}
			}

			function next() {
					fail = 0;
					AInput.style.backgroundColor = "#FFF";
					AInput.style.color = "#000";
					var random = Math.floor(Math.random()*Question.all[0].length);

					for (var n = 0; n < 2; n++) {
						Question.now[n] = Question.all[n][random];
					}

					Question.all[0].splice(random,1)
					Question.all[1].splice(random,1)
					QText.innerHTML = Question.now[0];
					AText.innerHTML = "none";
					AText.style.visibility = "hidden";
			}

			function restart() {
				event.preventDefault();
				result.style.visibility = "hidden";
				start(); 
			}
			
			function start() {
				finished = 0;
				sent = 0;
				Question.all = [

					["foresee", "infer", "deduce", "deem", "ponder", "assure", "assess", "concede", "compromise", "comprehend", "reconcile", "instill", "alert", "cognitive", "intuition", "vow", "nightmare", "stereotype", "illusion", "criterion", "ideology", "tolerate", "overlook", "conceive", "misunderstand", "keen", "subjective", "compulsory", "relieve", "trim", "disposal", "scent", "grain", "wheat", "deforestation", "drought", "irrigation", "spectacle", "altitude", "catastrophe", "wilderness", "decay", "erosion", "flame", "galaxy", "chill", "thermal", "fertile", "fossil", "exploit", "contaminate", "erupt", "roar", "inhabit", "nurture", "owl", "instinct", "prey", "anatomy", "mammal", "predator", "hybrid", "skull", "timber", "textile", "fabric", "mill", "weave", "competent", "optimistic", "patriotic", "noble", "naughty", "arrogant", "vigorous", "humble", "eligible", "courtesy", "resilient", "inclined", "haunt", "intent", "indulge", "flaw", "defect", "trait", "analogy", "parallel", "indispensable", "crucial", "grave", "primary", "vital", "integral", "profound", "grim", "fierce", "harsh","acute", "ambiguous", "misleading", "obscure", "mature", "neat", "decent", "straightforward", "sophisticated", "elaborate", "prompt", "swift", "mighty", "explicit", "authentic", "wit", "thrive", "dim", "gloomy", "barren", "idle", "adverse", "tiresome", "clumsy", "foul", "shabby", "outrageous", "absurd", "fragile", "vulnerable", "static", "innate"]
				];
				len = Question.all[0].length;
				progress.innerHTML = `${finished} / ${len}`;
				next()
			}

			function fin() {
				RText.innerHTML = `正答率 : ${Math.floor(len/sent*1000)/10}%`
				result.style.visibility = "visible";
			}

			start()
		</script>
	</body>
</html>
